<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Disnara Transportes</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <header class="container-fluid">

        <div class="row align-items-center">

            <!-- Logo -->
            <div class="col-12 col-md-4 text-center text-md-start">

                <img src="imgs/disnaratransporte.png"
                    alt="Logo">

            </div>

            <!-- Div de busca (campo de texto e botao) -->
            <div class="col-12 col-md-8">

                <div class="buscar_linha">

                    <input type="text"
                        id="campo_digita"
                        placeholder="Digite a linha">

                    <button id="botao_buscar">
                        Buscar linha
                    </button>

                </div>

            </div>

        </div>

    </header>

    <!-- HERO -->
    <main>
        <section class="hero">

            <!-- MAPA -->
            <div id="map"></div>

        </section>
    </main>

    <!-- PROJ4 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.19.10/proj4.js"
            integrity="sha512-QXAXxYhXWvAc5fA3edU2rOQANjhwKAAlqz1WEhh/FXzODQoqVb9PkHqJcCG7aFoJpN0VQMNnxOBztoIQOcEO5w=="
            crossorigin="anonymous"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/4.1.2/papaparse.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->
    <script src="app.js"></script>

</body>

</html>
