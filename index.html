<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Disnara Transportes</title>

    <!-- Seu CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <header class="container-fluid py-3">
        <div class="row align-items-center">

            <!-- Logo -->
            <div class="col-12 col-md-4 text-center text-md-start">
                <img src="imgs/disnaratransporte.png"
                     alt="Logo"
                     class="img-fluid"
                     style="max-height: 90px;">
            </div>

            <!-- Div de busca (campo de texto e botão) -->
            <div class="col-12 col-md-8">
                <div class="buscar_linha d-flex gap-2 justify-content-md-end justify-content-center mt-3 mt-md-0">
                    <input type="text"
                           id="campo_digita"
                           class="form-control w-auto"
                           placeholder="Digite a linha">
                    <button id="botao_buscar"
                            class="btn btn-primary">
                        Buscar linha
                    </button>
                </div>
            </div>

        </div>
    </header>

    <!-- HERO -->
    <main>
        <section class="hero">
            <!-- MAPA -->
            <div id="map"></div>
        </section>
    </main>

    <!-- proj4 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.19.10/proj4.js"
            integrity="sha512-QXAXxYhXWvAc5fA3edU2rOQANjhwKAAlqz1WEhh/FXzODQoqVb9PkHqJcCG7aFoJpN0VQMNnxOBztoIQOcEO5w=="
            crossorigin="anonymous"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/4.1.2/papaparse.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <!-- JS -->
    <script src="app.js"></script>

</body>
</html>
